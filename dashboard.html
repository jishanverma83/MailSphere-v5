<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – MailSphere S</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-area">
      <div id="header-mount"></div>
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle" id="dashDate"></p>
            <p class="sync-status" id="syncStatus"></p>
          </div>
          <button class="btn btn-ghost" id="refreshBtn">
            <span id="refreshIcon"></span>
            Refresh
          </button>
        </div>

        <!-- Stat cards -->
        <div class="stat-grid" id="statGrid"></div>

        <div class="v6-intelligence-grid">
          <section class="chart-card glass">
            <div class="chart-card-header"><div><div class="chart-card-title">School Intelligence</div><div class="chart-card-subtitle">Signals detected from your inbox</div></div></div>
            <div class="intelligence-cards" id="intelligenceCards"></div>
          </section>
          <section class="chart-card glass">
            <div class="chart-card-header"><div><div class="chart-card-title">Smart Timeline</div><div class="chart-card-subtitle">Dates found in school emails</div></div></div>
            <div class="smart-timeline" id="smartTimeline"></div>
          </section>
        </div>

        <!-- Charts -->
        <div class="dashboard-grid">
          <div class="chart-card glass animate-slideUp">
            <div class="chart-card-header">
              <div>
                <div class="chart-card-title">Weekly Email Trend</div>
                <div class="chart-card-subtitle">Emails received over the past 7 days</div>
              </div>
            </div>
            <div class="chart-container"><canvas id="weeklyChart"></canvas></div>
          </div>
          <div class="chart-card glass animate-slideUp stagger-1">
            <div class="chart-card-header">
              <div>
                <div class="chart-card-title">Category Breakdown</div>
                <div class="chart-card-subtitle">Distribution by smart category</div>
              </div>
            </div>
            <div class="chart-container"><canvas id="categoryChart"></canvas></div>
          </div>
        </div>

        <!-- Recent emails -->
        <div class="chart-card glass animate-slideUp stagger-2">
          <div class="chart-card-header">
            <div>
              <div class="chart-card-title">Recent Emails</div>
              <div class="chart-card-subtitle">Latest messages in your inbox</div>
            </div>
            <a href="inbox.html" class="btn btn-ghost" style="padding:6px 14px;font-size:0.75rem">View all</a>
          </div>
          <div class="recent-emails" id="recentEmails"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/sample-data.js"></script>
  <script src="./js/email-store.js"></script>
  <script src="./js/gmail.js"></script>
  <script src="./js/dashboard.js"></script>
</body>
</html>
